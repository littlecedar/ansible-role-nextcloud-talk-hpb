########################################################################
#                                                                      #
# Identifiers and restart signalling                                   #
#                                                                      #
########################################################################

nextcloud_talk_hpb_nats_identifier: "{{ nextcloud_talk_hpb_identifier }}-nats"

nextcloud_talk_hpb_signaling_identifier: "{{ nextcloud_talk_hpb_identifier }}-signaling"

nextcloud_talk_hpb_janus_identifier: "{{ nextcloud_talk_hpb_identifier }}-janus"

# Controls whether the systemd service manager restarts the units (when true) or merely
# starts them (when false). It is computed during installation, based on whether any
# support file, systemd unit, or image changed.
nextcloud_talk_hpb_restart_necessary: false
