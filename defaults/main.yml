# Built and published by this repository.
nextcloud_talk_hpb_nats_container_image_tag: "2.15.1"

nextcloud_talk_hpb_nats_container_image: "ghcr.io/littlecedar/ansible-role-nextcloud-talk-hpb-nats:{{ nextcloud_talk_hpb_nats_container_image_tag }}"

# Pull the published image before starting the container. Disable when the image is
# built or loaded locally.
nextcloud_talk_hpb_nats_container_image_pull: true

nextcloud_talk_hpb_nats_systemd_required_services_list: "{{ nextcloud_talk_hpb_nats_systemd_required_services_list_default + nextcloud_talk_hpb_nats_systemd_required_services_list_auto + nextcloud_talk_hpb_nats_systemd_required_services_list_custom }}"

nextcloud_talk_hpb_nats_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"

nextcloud_talk_hpb_nats_systemd_required_services_list_auto: []

nextcloud_talk_hpb_nats_systemd_required_services_list_custom: []

nextcloud_talk_hpb_nats_systemd_wanted_services_list: "{{ nextcloud_talk_hpb_nats_systemd_wanted_services_list_default + nextcloud_talk_hpb_nats_systemd_wanted_services_list_auto + nextcloud_talk_hpb_nats_systemd_wanted_services_list_custom }}"

nextcloud_talk_hpb_nats_systemd_wanted_services_list_default: []

nextcloud_talk_hpb_nats_systemd_wanted_services_list_auto: []

nextcloud_talk_hpb_nats_systemd_wanted_services_list_custom: []

# Size of the container's tmpfs mount at /tmp (NATS keeps runtime state only in memory).
nextcloud_talk_hpb_nats_container_tmpfs_tmp_size: 16m

nextcloud_talk_hpb_nats_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

nextcloud_talk_hpb_nats_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

nextcloud_talk_hpb_nats_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

nextcloud_talk_hpb_nats_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ nextcloud_talk_hpb_nats_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ nextcloud_talk_hpb_nats_container_stop_grace_time_seconds }} {{ nextcloud_talk_hpb_nats_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ nextcloud_talk_hpb_nats_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ nextcloud_talk_hpb_nats_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ nextcloud_talk_hpb_nats_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ nextcloud_talk_hpb_nats_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ nextcloud_talk_hpb_nats_identifier }} after {{ nextcloud_talk_hpb_nats_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

########################################################################
