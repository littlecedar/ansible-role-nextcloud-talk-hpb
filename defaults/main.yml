########################################################################
#                                                                      #
# Common                                                               #
#                                                                      #
########################################################################

# nextcloud_talk_hpb_enabled is the master toggle for the whole role.
nextcloud_talk_hpb_enabled: false

nextcloud_talk_hpb_identifier: nextcloud-talk-hpb

nextcloud_talk_hpb_base_path: "/{{ nextcloud_talk_hpb_identifier }}"

# The user and group that own the rendered support files and run the NATS and
# signaling containers. These are typically injected by the playbook
# (e.g. `{{ mash_playbook_uid }}`).
nextcloud_talk_hpb_uid: ""

nextcloud_talk_hpb_gid: ""

# The public hostname of the signaling server, as served by the external TLS reverse proxy
# (and as entered in Nextcloud Talk's HPB settings).
nextcloud_talk_hpb_hostname: ""

# The host's public IP address. Janus announces it as its 1:1 NAT mapping, so WebRTC
# clients receive a reachable candidate for the host-networking Janus container.
nextcloud_talk_hpb_public_ip: ""

# The Nextcloud base URL, e.g. `https://cloud.example.com`.
# The signaling server accepts connections from this exact backend only.
nextcloud_talk_hpb_nextcloud_url: ""

# The TURN REST shared secret. It MUST match the secret of the operator's external
# TURN server (coturn `--use-auth-secret`). Janus derives ephemeral TURN credentials from it.
nextcloud_talk_hpb_turn_static_auth_secret: ""

# The shared secret between Nextcloud Talk and the signaling server.
# The same value is registered with `occ talk:signaling:add`.
nextcloud_talk_hpb_signaling_secret: ""

# Signaling session secrets (any random string; hashes are recommended).
# `signaling_hash_key` and `signaling_block_key` protect session contents in transit,
# `signaling_internal_shared_secret_key` authenticates internal clients.
nextcloud_talk_hpb_signaling_hash_key: ""

nextcloud_talk_hpb_signaling_block_key: ""

nextcloud_talk_hpb_signaling_internal_shared_secret_key: ""

# The token that the signaling server uses to authenticate against NATS.
nextcloud_talk_hpb_nats_token: ""

########################################################################
#                                                                      #
# Networks                                                             #
#                                                                      #
########################################################################

# The external Docker network of the operator's reverse proxy (Traefik).
# The role never creates or deletes it; it only attaches the signaling container to it.
nextcloud_talk_hpb_proxy_network: proxy

# The subnet of the external proxy network. When empty, it is detected from the existing
# network and validated.
nextcloud_talk_hpb_proxy_network_subnet: ""

# The internal network shared by the signaling and NATS containers.
# It is an internal bridge: it has no host route.
nextcloud_talk_hpb_hpb_network: "{{ nextcloud_talk_hpb_identifier }}-hpb"

nextcloud_talk_hpb_hpb_subnet: 172.28.0.0/24

# NATS uses a fixed address so that the signaling server's NATS URL never changes.
nextcloud_talk_hpb_nats_container_ip: 172.28.0.4

# The network between the signaling container and the host-networking Janus container.
# The signaling server reaches the Janus WebSocket transport at `<egress_gateway>:8188`;
# Janus accepts it only from `egress_subnet`.
nextcloud_talk_hpb_egress_network: "{{ nextcloud_talk_hpb_identifier }}-egress"

nextcloud_talk_hpb_egress_subnet: 172.29.0.0/24

nextcloud_talk_hpb_egress_gateway: 172.29.0.1

# Controls whether the role removes its own networks on uninstall.
nextcloud_talk_hpb_hpb_network_deletion_enabled: true

nextcloud_talk_hpb_egress_network_deletion_enabled: true

# Documented for completeness only: the external proxy network is never removed by this
# role, so this flag has no effect.
nextcloud_talk_hpb_proxy_network_deletion_enabled: false

########################################################################
#                                                                      #
# /Common                                                              #
#                                                                      #
########################################################################

########################################################################
#                                                                      #
# Signaling                                                            #
#                                                                      #
########################################################################

# Built and published by this repository.
nextcloud_talk_hpb_signaling_container_image_tag: "2.1.1"

nextcloud_talk_hpb_signaling_container_image: "ghcr.io/littlecedar/ansible-role-nextcloud-talk-hpb-spreed:{{ nextcloud_talk_hpb_signaling_container_image_tag }}"

# Pull the published image before starting the container. Disable when the image is
# built or loaded locally.
nextcloud_talk_hpb_signaling_container_image_pull: true

# The port the signaling server listens on inside the container.
nextcloud_talk_hpb_signaling_container_http_port: 8081

# Where the signaling HTTP port is published on the host.
# The loopback publish is required: the Janus event handler connects to it.
# The external reverse proxy reaches the container over the proxy network instead,
# so this MUST never be published on a public interface.
nextcloud_talk_hpb_signaling_container_http_host_bind_port: "127.0.0.1:8081"

# Allow any hostname as a backend endpoint, using `signaling_backends_allowall_secret`.
# This is extremely insecure: test-only, never enable it in production.
nextcloud_talk_hpb_signaling_backends_allowall: false

nextcloud_talk_hpb_signaling_backends_allowall_secret: ""

# Attach Traefik labels to the signaling container.
nextcloud_talk_hpb_signaling_container_labels_traefik_enabled: true

nextcloud_talk_hpb_signaling_container_labels_traefik_docker_network: "{{ nextcloud_talk_hpb_proxy_network }}"

nextcloud_talk_hpb_signaling_container_labels_traefik_hostname: "{{ nextcloud_talk_hpb_hostname }}"

nextcloud_talk_hpb_signaling_container_labels_traefik_entrypoints: web-secure

# Traefik's own option name is camelCase (`tls.certResolver`).
nextcloud_talk_hpb_signaling_container_labels_traefik_tls_certResolver: default  # noqa: var-naming

nextcloud_talk_hpb_signaling_container_labels_additional_labels_custom: []

nextcloud_talk_hpb_signaling_systemd_required_services_list: "{{ nextcloud_talk_hpb_signaling_systemd_required_services_list_default + nextcloud_talk_hpb_signaling_systemd_required_services_list_auto + nextcloud_talk_hpb_signaling_systemd_required_services_list_custom }}"

nextcloud_talk_hpb_signaling_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"

nextcloud_talk_hpb_signaling_systemd_required_services_list_auto: []

nextcloud_talk_hpb_signaling_systemd_required_services_list_custom: []

nextcloud_talk_hpb_signaling_systemd_wanted_services_list: "{{ nextcloud_talk_hpb_signaling_systemd_wanted_services_list_default + nextcloud_talk_hpb_signaling_systemd_wanted_services_list_auto + nextcloud_talk_hpb_signaling_systemd_wanted_services_list_custom }}"

nextcloud_talk_hpb_signaling_systemd_wanted_services_list_default: []

nextcloud_talk_hpb_signaling_systemd_wanted_services_list_auto: []

nextcloud_talk_hpb_signaling_systemd_wanted_services_list_custom: []

# Size of the container's tmpfs mount at /tmp. The signaling server renders its
# configuration there, because the container root filesystem is read-only.
nextcloud_talk_hpb_signaling_container_tmpfs_tmp_size: 16m

nextcloud_talk_hpb_signaling_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

nextcloud_talk_hpb_signaling_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

nextcloud_talk_hpb_signaling_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

nextcloud_talk_hpb_signaling_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ nextcloud_talk_hpb_signaling_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ nextcloud_talk_hpb_signaling_container_stop_grace_time_seconds }} {{ nextcloud_talk_hpb_signaling_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ nextcloud_talk_hpb_signaling_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ nextcloud_talk_hpb_signaling_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ nextcloud_talk_hpb_signaling_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ nextcloud_talk_hpb_signaling_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ nextcloud_talk_hpb_signaling_identifier }} after {{ nextcloud_talk_hpb_signaling_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

########################################################################
#                                                                      #
# /Signaling                                                           #
#                                                                      #
########################################################################

########################################################################
#                                                                      #
# Janus                                                                #
#                                                                      #
########################################################################

# The Janus image tag is also the Janus release it was built from.
nextcloud_talk_hpb_janus_container_image_tag: "1.4.3"

nextcloud_talk_hpb_janus_container_image: "ghcr.io/littlecedar/ansible-role-nextcloud-talk-hpb:{{ nextcloud_talk_hpb_janus_container_image_tag }}"

# Build the image locally from source instead of pulling it.
# Useful when the GHCR image is unavailable to the host.
nextcloud_talk_hpb_janus_container_image_self_build: false

nextcloud_talk_hpb_janus_container_image_self_build_repo: "https://github.com/littlecedar/ansible-role-nextcloud-talk-hpb.git"

nextcloud_talk_hpb_janus_container_image_self_build_repo_version: "v1.4.3-0"

# The UDP port range Janus uses for RTP/RTCP. Host networking is required for it.
nextcloud_talk_hpb_janus_rtp_port_range: "20000-40000"

# Janus gathers TURN relay candidates from this TURN server, using TURN REST credentials
# derived from `nextcloud_talk_hpb_turn_static_auth_secret`.
nextcloud_talk_hpb_janus_turn_server_host: 127.0.0.1

nextcloud_talk_hpb_janus_turn_server_port: 3478

nextcloud_talk_hpb_janus_systemd_required_services_list: "{{ nextcloud_talk_hpb_janus_systemd_required_services_list_default + nextcloud_talk_hpb_janus_systemd_required_services_list_auto + nextcloud_talk_hpb_janus_systemd_required_services_list_custom }}"

nextcloud_talk_hpb_janus_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"

nextcloud_talk_hpb_janus_systemd_required_services_list_auto: []

nextcloud_talk_hpb_janus_systemd_required_services_list_custom: []

nextcloud_talk_hpb_janus_systemd_wanted_services_list: "{{ nextcloud_talk_hpb_janus_systemd_wanted_services_list_default + nextcloud_talk_hpb_janus_systemd_wanted_services_list_auto + nextcloud_talk_hpb_janus_systemd_wanted_services_list_custom }}"

nextcloud_talk_hpb_janus_systemd_wanted_services_list_default: ["{{ nextcloud_talk_hpb_signaling_identifier }}.service"]

nextcloud_talk_hpb_janus_systemd_wanted_services_list_auto: []

nextcloud_talk_hpb_janus_systemd_wanted_services_list_custom: []

# Services that the Janus unit is ordered after, without depending on them.
nextcloud_talk_hpb_janus_systemd_after_services_list: ["{{ nextcloud_talk_hpb_signaling_identifier }}.service"]

# Size of the container's tmpfs mount at /tmp. The entrypoint renders the Janus
# configuration (including TURN credentials) there.
nextcloud_talk_hpb_janus_container_tmpfs_tmp_size: 64m

nextcloud_talk_hpb_janus_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

nextcloud_talk_hpb_janus_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

nextcloud_talk_hpb_janus_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

nextcloud_talk_hpb_janus_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ nextcloud_talk_hpb_janus_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ nextcloud_talk_hpb_janus_container_stop_grace_time_seconds }} {{ nextcloud_talk_hpb_janus_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ nextcloud_talk_hpb_janus_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ nextcloud_talk_hpb_janus_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ nextcloud_talk_hpb_janus_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ nextcloud_talk_hpb_janus_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ nextcloud_talk_hpb_janus_identifier }} after {{ nextcloud_talk_hpb_janus_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

