---
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the linters
        run: pip install ansible-core ansible-lint yamllint

      - name: Install the collections the role uses
        run: ansible-galaxy collection install community.docker

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible
        run: ansible-lint

  image:
    name: Image smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: janus
            context: build/janus
            tag: ansible-role-nextcloud-talk-hpb:ci
            smoke: ./scripts/smoke-test-janus.sh
          - service: nats
            context: build/nats
            tag: nextcloud-talk-hpb-nats:ci
            smoke: ./scripts/smoke-test-nats.sh
          - service: spreed
            context: build/spreed
            tag: nextcloud-talk-hpb-spreed:ci
            smoke: ./scripts/smoke-test-spreed.sh
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          provenance: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Run the ${{ matrix.service }} smoke test
        run: ${{ matrix.smoke }} ${{ matrix.tag }}

  molecule:
    name: Role smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install molecule and its Docker driver
        run: pip install "molecule" "molecule-plugins[docker]"

      - name: Install the Ansible role and collection dependencies
        run: |
          ansible-galaxy role install -r molecule/default/requirements.yml
          ansible-galaxy collection install community.docker

      - name: Run the role smoke test
        run: molecule test
        env:
          # molecule-docker 2.1.0 still uses string conditionals, which
          # ansible-core 2.21 rejects by default.
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "1"
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
