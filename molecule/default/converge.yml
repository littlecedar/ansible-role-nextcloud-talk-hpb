---
- name: Converge
  hosts: all
  become: true
  vars:
    nextcloud_talk_hpb_enabled: true
    nextcloud_talk_hpb_uid: 1000
    nextcloud_talk_hpb_gid: 1000
    nextcloud_talk_hpb_hostname: localhost
    nextcloud_talk_hpb_public_ip: 127.0.0.1
    nextcloud_talk_hpb_nextcloud_url: https://example.invalid
    nextcloud_talk_hpb_turn_static_auth_secret: smoke-turn-secret
    nextcloud_talk_hpb_signaling_secret: smoke-signaling-secret
    # Signaling warns unless the hash key is 32 or 64 bytes, and refuses to start unless
    # the block key is 16, 24 or 32 bytes.
    nextcloud_talk_hpb_signaling_hash_key: "smoke-hash-key-0123456789abcdef0123456789abcdef0123456789abcdef0"
    nextcloud_talk_hpb_signaling_block_key: "smoke-block-key-0123456789abcdef"
    nextcloud_talk_hpb_signaling_internal_shared_secret_key: smoke-internal-secret
    nextcloud_talk_hpb_nats_token: smoke-nats-token
    nextcloud_talk_hpb_proxy_network: proxy
    nextcloud_talk_hpb_proxy_network_subnet: 172.30.99.0/24
    nextcloud_talk_hpb_signaling_container_labels_traefik_enabled: false
    nextcloud_talk_hpb_signaling_backends_allowall: true
    nextcloud_talk_hpb_signaling_backends_allowall_secret: smoke-secret
    nextcloud_talk_hpb_janus_rtp_port_range: "20000-20010"
    # The Janus image is not published yet when molecule runs, so build it inside the
    # instance from the repository's own image files (the documented self-build path).
    nextcloud_talk_hpb_janus_container_image_self_build: true
    nextcloud_talk_hpb_janus_container_image_self_build_repo: /srv/ansible-role-nextcloud-talk-hpb
    nextcloud_talk_hpb_janus_container_image_self_build_repo_version: v1.4.3-0
    nextcloud_talk_hpb_janus_container_image: nextcloud-talk-hpb-janus:ci
    # NATS and Spreed images are built from this repository's Dockerfiles in prepare.
    nextcloud_talk_hpb_nats_container_image: nextcloud-talk-hpb-nats:ci
    nextcloud_talk_hpb_nats_container_image_pull: false
    nextcloud_talk_hpb_signaling_container_image: nextcloud-talk-hpb-spreed:ci
    nextcloud_talk_hpb_signaling_container_image_pull: false
  roles:
    - role: com.devture.ansible.role.playbook_help
    - role: com.devture.ansible.role.systemd_docker_base
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

  post_tasks:
    - name: Start the Nextcloud Talk HPB units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - nextcloud-talk-hpb-nats.service
        - nextcloud-talk-hpb-signaling.service
        - nextcloud-talk-hpb-janus.service
