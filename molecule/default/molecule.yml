---
dependency:
  name: galaxy
  # Molecule only looks for a requirements file in the project root, so the role and
  # collection dependencies are installed explicitly instead (see README and CI):
  #   ansible-galaxy role install -r molecule/default/requirements.yml
  enabled: false
driver:
  name: docker
platforms:
  - name: nextcloud-talk-hpb
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    # Docker runs inside this instance, so it needs to be privileged and to share
    # the host cgroup namespace for both systemd and the nested daemon.
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    security_opts:
      - seccomp=unconfined
    capabilities:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW
    tmpfs:
      - /run
      - /run/lock
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      # molecule-docker 2.1.0 still uses string conditionals, which ansible-core 2.21
      # rejects by default.
      allow_broken_conditionals: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
